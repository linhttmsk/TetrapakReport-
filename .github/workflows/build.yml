name: Build & Release TetrapakReport

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install Inno Setup
        run: choco install innosetup -y
        shell: cmd

      - name: Build exe with PyInstaller
        run: |
          pyinstaller --onefile --noconsole `
            --name "TetrapakReport" `
            --icon "scripts/icon.ico" `
            --copy-metadata streamlit `
            --copy-metadata pyodbc `
            --copy-metadata pandas `
            --add-data "app/.streamlit;app/.streamlit" `
            --add-data "app/src;app/src" `
            --add-data "app/pages;app/pages" `
            --add-data "app/Home.py;app" `
            TetrapakReport.py

      - name: Build installer with Inno Setup
        run: iscc scripts\setup.iss
        shell: cmd

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: scripts/Output/TetrapakReport_Setup*.exe

  release:
    needs: [build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: artifacts/windows

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "TetrapakReport ${{ github.ref_name }}"
          body: |
            ## TetrapakReport ${{ github.ref_name }}
            - **Windows**: TetrapakReport_Setup.exe
          files: |
            artifacts/windows/TetrapakReport_Setup*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
